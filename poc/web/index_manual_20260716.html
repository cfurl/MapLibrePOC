<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CFHydromet Manual Tile POC - 2026-07-16</title>

  <link rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
        crossorigin="anonymous" />

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"
          crossorigin="anonymous"></script>

  <script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f3f1e8;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
    }

    .poc-badge {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 10;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 6px rgba(0,0,0,0.2);
      font-size: 13px;
      line-height: 1.3;
      pointer-events: none;
    }

    .rain-legend {
      position: absolute;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      width: min(620px, calc(100vw - 34px));
      padding: 9px 12px 8px 12px;
      border-radius: 9px;
      background: rgba(15,15,15,0.88);
      box-shadow: 0 1px 8px rgba(0,0,0,0.35);
      color: white;
      pointer-events: none;
    }

    .rain-legend-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
      gap: 8px;
    }

    .rain-legend-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .rain-legend-note {
      font-size: 10px;
      opacity: 0.72;
    }

    .legend-bar {
      display: flex;
      height: 13px;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.08);
    }

    .legend-segment {
      height: 100%;
    }

    .legend-labels {
      position: relative;
      height: 17px;
      margin-top: 3px;
      font-size: 9px;
      color: rgba(255,255,255,0.94);
    }

    .legend-label {
      position: absolute;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .legend-label.first {
      transform: none;
    }

    .legend-label.last {
      transform: translateX(-100%);
    }

    @media (max-width: 600px) {
      .poc-badge {
        font-size: 11px;
        padding: 6px 8px;
      }

      .rain-legend {
        width: calc(100vw - 24px);
        padding: 7px 9px 6px 9px;
        bottom: max(18px, env(safe-area-inset-bottom));
      }

      .rain-legend-title {
        font-size: 11px;
      }

      .rain-legend-note {
        font-size: 9px;
      }

      .legend-bar {
        height: 11px;
      }

      .legend-labels {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="poc-badge">
    <strong>CFHydromet Manual Tile POC</strong><br>
    July 16, 2026 Stage IV precipitation
  </div>

  <div class="rain-legend">
    <div class="rain-legend-header">
      <div class="rain-legend-title">Rainfall (in)</div>
      <div class="rain-legend-note">24-hour Stage IV</div>
    </div>
    <div id="legend-bar" class="legend-bar"></div>
    <div id="legend-labels" class="legend-labels"></div>
  </div>

  <script>
    // ========================================================================
    // CONFIG
    // ========================================================================

    const DATE_ID = "20260716";

    // Local style JSON:
    // C:\stg4\MapLibrePOC\poc\web\cfhydromet_basemap_light.json
    const STYLE_URL = "./cfhydromet_basemap_light.json";

    // Try the two basemap filenames used during the POC work.
    // First one that exists wins.
    const BASEMAP_CANDIDATES = [
      "../pmt/labatt_basemap_test.pmtiles",
      "../pmt/labatt_poc.pmtiles"
    ];

    // Tiles just built by 03_rgba_to_xyz_tiles.bat.
    const RADAR_TILE_TEMPLATE =
      `../manual/tiles/${DATE_ID}/{z}/{x}/{y}.png`;

    const RADAR_MIN_ZOOM = 4;
    const RADAR_MAX_ZOOM = 9;

    // Approximate rectangular extent of the Texas Stage IV display raster.
    // This keeps MapLibre from requesting radar tiles far outside the product.
    const RADAR_BOUNDS = [
      -106.69, 25.80,
       -93.46, 36.54
    ];

    // ========================================================================
    // PMTILES PROTOCOL
    // ========================================================================

    const pmtilesProtocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", pmtilesProtocol.tile);

    // ========================================================================
    // LEGEND ONLY
    //
    // Color is already baked into the PNG tiles. These values only draw
    // the legend so it stays visually consistent with 02_cog_to_rgba.R.
    // ========================================================================

    const rainSegments = [
      { min:0.001, max:0.25, start:"#d7dee9", end:"#173f9d", width:1.55 },
      { min:0.25,  max:1.50, start:"#39ef63", end:"#006719", width:2.10 },
      { min:1.50,  max:3.00, start:"#fff23b", end:"#ff8b00", width:1.55 },
      { min:3.00,  max:5.00, start:"#ff5738", end:"#c90e18", width:1.30 },
      { min:5.00,  max:8.00, start:"#c68cff", end:"#64208f", width:1.25 },
      { min:8.00,  max:12.0, start:"#ff5cc8", end:"#b0006f", width:1.10 }
    ];

    const extremeColor = "#5a003f";
    const extremeWeight = 0.55;

    const legendBar = document.getElementById("legend-bar");
    const legendLabels = document.getElementById("legend-labels");

    rainSegments.forEach(segment => {
      const div = document.createElement("div");
      div.className = "legend-segment";
      div.style.flex = `${segment.width} 1 0`;
      div.style.background =
        `linear-gradient(to right, ${segment.start}, ${segment.end})`;
      legendBar.appendChild(div);
    });

    const extremeDiv = document.createElement("div");
    extremeDiv.className = "legend-segment";
    extremeDiv.style.flex = `${extremeWeight} 1 0`;
    extremeDiv.style.background = extremeColor;
    legendBar.appendChild(extremeDiv);

    const totalSegmentWeight = rainSegments.reduce(
      (sum, segment) => sum + segment.width,
      0
    );

    const totalWeight = totalSegmentWeight + extremeWeight;

    const legendStops = [
      { value:"0",    weight:0 },
      { value:"0.25", weight:rainSegments[0].width },
      { value:"1.5",  weight:rainSegments[0].width + rainSegments[1].width },
      { value:"3",    weight:rainSegments[0].width + rainSegments[1].width + rainSegments[2].width },
      { value:"5",    weight:rainSegments[0].width + rainSegments[1].width + rainSegments[2].width + rainSegments[3].width },
      { value:"8",    weight:rainSegments[0].width + rainSegments[1].width + rainSegments[2].width + rainSegments[3].width + rainSegments[4].width },
      { value:"12+",  weight:totalWeight }
    ];

    legendStops.forEach((stop, index) => {
      const label = document.createElement("span");
      label.className = "legend-label";

      if (index === 0) {
        label.classList.add("first");
      }

      if (index === legendStops.length - 1) {
        label.classList.add("last");
      }

      label.textContent = stop.value;
      label.style.left = `${100 * stop.weight / totalWeight}%`;
      legendLabels.appendChild(label);
    });

    // ========================================================================
    // HELPERS
    // ========================================================================

    async function firstExistingUrl(urls) {
      for (const url of urls) {
        try {
          const response = await fetch(url, {
            method: "HEAD",
            cache: "no-store"
          });

          if (response.ok) {
            return url;
          }
        } catch (error) {
          // Try next candidate.
        }
      }

      throw new Error(
        "No local PMTiles basemap found. Tried: " + urls.join(", ")
      );
    }

    async function loadLocalStyle(pmtilesUrl) {
      const response = await fetch(STYLE_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          `Could not load ${STYLE_URL}: ${response.status} ${response.statusText}`
        );
      }

      const style = await response.json();

      const absolutePmtilesUrl =
        `pmtiles://${new URL(pmtilesUrl, window.location.href).href}`;

      // Rewrite all PMTiles sources in the local style to the local basemap.
      Object.values(style.sources || {}).forEach(source => {
        if (
          source &&
          typeof source.url === "string" &&
          source.url.startsWith("pmtiles://")
        ) {
          source.url = absolutePmtilesUrl;
        }
      });

      return style;
    }

    // ========================================================================
    // MAP
    // ========================================================================

    async function startMap() {
      const basemapUrl = await firstExistingUrl(BASEMAP_CANDIDATES);

      console.log("Using basemap:", basemapUrl);
      console.log("Using radar tiles:", RADAR_TILE_TEMPLATE);

      const localStyle = await loadLocalStyle(basemapUrl);

      const map = new maplibregl.Map({
        container: "map",
        style: localStyle,
        center: [-99.43335, 30.115],
        zoom: 6.7
      });

      map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
      );

      map.addControl(
        new maplibregl.ScaleControl({
          maxWidth: 120,
          unit: "imperial"
        }),
        "bottom-left"
      );

      function resizeMap() {
        window.setTimeout(() => {
          map.resize();
        }, 100);
      }

      window.addEventListener("resize", resizeMap);
      window.addEventListener("orientationchange", resizeMap);

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeMap);
      }

      map.on("load", () => {
        map.addSource("texas-rainfall", {
          type: "raster",
          tiles: [RADAR_TILE_TEMPLATE],
          tileSize: 256,
          minzoom: RADAR_MIN_ZOOM,
          maxzoom: RADAR_MAX_ZOOM,
          bounds: RADAR_BOUNDS
        });

        // Put rainfall below labels so roads/place labels remain readable.
        const firstSymbolLayer = map
          .getStyle()
          .layers
          .find(layer => layer.type === "symbol");

        const beforeLayerId = firstSymbolLayer
          ? firstSymbolLayer.id
          : undefined;

        map.addLayer(
          {
            id: "texas-rainfall",
            type: "raster",
            source: "texas-rainfall",
            paint: {
              "raster-opacity": 0.78,
              "raster-resampling": "linear",
              "raster-fade-duration": 0
            }
          },
          beforeLayerId
        );

        console.log("July 16 XYZ rainfall tiles added.");
      });

      map.on("error", event => {
        console.error(
          "MapLibre error:",
          event.error || event
        );
      });
    }

    startMap().catch(error => {
      console.error("POC startup error:", error);
    });
  </script>
</body>
</html>
