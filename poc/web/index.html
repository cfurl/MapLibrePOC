<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>CFHydromet MapLibre POC</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
<style>
html,body,#map{width:100%;height:100%;margin:0;padding:0}
body{overflow:hidden;font-family:Arial,sans-serif}
#map{position:absolute;inset:0}
.poc-badge{position:absolute;top:12px;left:12px;z-index:10;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.2);font-size:13px;line-height:1.25;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="poc-badge"><strong>CFHydromet MapLibre POC</strong><br>PMTiles via CloudFront</div>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  style: "https://cfhydromet.com/styles/cfhydromet_basemap.json",
  center: [-99.43335, 30.115],
  zoom: 6.7
});

map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({maxWidth:120, unit:"imperial"}), "bottom-left");

map.on("load", () => console.log("CloudFront-hosted PMTiles map loaded."));
map.on("error", e => console.error("MapLibre error:", e.error || e));
</script>
</body>
</html>
