<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CFHydromet MapLibre POC</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/@geomatico/maplibre-cog-protocol/dist/index.js"></script>

  <style>
    html,
    body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#f3f1e8;
      font-family:Arial,sans-serif;
    }

    body {
      position:fixed;
      inset:0;
    }

    #map {
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      min-height:100vh;
    }

    .poc-badge {
      position:absolute;
      top:max(12px, env(safe-area-inset-top));
      left:max(12px, env(safe-area-inset-left));
      z-index:10;
      padding:8px 10px;
      border-radius:8px;
      background:rgba(255,255,255,0.92);
      box-shadow:0 1px 6px rgba(0,0,0,0.2);
      font-size:13px;
      line-height:1.3;
      pointer-events:none;
    }

    /* MyRadar-style horizontal legend */
    .rain-legend {
      position:absolute;
      left:50%;
      bottom:max(22px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:10;
      width:min(620px, calc(100vw - 34px));
      padding:9px 12px 8px 12px;
      border-radius:9px;
      background:rgba(15,15,15,0.88);
      box-shadow:0 1px 8px rgba(0,0,0,0.35);
      color:white;
      pointer-events:none;
    }

    .rain-legend-header {
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      margin-bottom:5px;
      gap:8px;
    }

    .rain-legend-title { font-size:12px; font-weight:700; letter-spacing:0.2px; }
    .rain-legend-note { font-size:10px; opacity:0.72; }

    .legend-bar {
      display:flex;
      height:13px;
      overflow:hidden;
      border-radius:4px;
      border:1px solid rgba(255,255,255,0.45);
      background:rgba(255,255,255,0.08);
    }

    .legend-segment { height:100%; }

    .legend-labels {
      position:relative;
      height:17px;
      margin-top:3px;
      font-size:9px;
      color:rgba(255,255,255,0.94);
    }

    .legend-label {
      position:absolute;
      transform:translateX(-50%);
      white-space:nowrap;
    }

    .legend-label.first { transform:none; }
    .legend-label.last { transform:translateX(-100%); }

    @media (max-width:600px) {
      .poc-badge { font-size:11px; padding:6px 8px; }
      .rain-legend {
        width:calc(100vw - 24px);
        padding:7px 9px 6px 9px;
        bottom:max(18px, env(safe-area-inset-bottom));
      }
      .rain-legend-title { font-size:11px; }
      .rain-legend-note { font-size:9px; }
      .legend-bar { height:11px; }
      .legend-labels { font-size:8px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="poc-badge">
    <strong>CFHydromet MapLibre POC</strong><br>
    July 15, 2026 Stage IV precipitation
  </div>

  <div id="rain-legend" class="rain-legend">
    <div class="rain-legend-header">
      <div class="rain-legend-title">Rainfall (in)</div>
      <div class="rain-legend-note">24-hour Stage IV</div>
    </div>
    <div id="legend-bar" class="legend-bar"></div>
    <div id="legend-labels" class="legend-labels"></div>
  </div>

  <script>
    // ========================================================================
    // PROTOCOLS
    // ========================================================================
    const pmtilesProtocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", pmtilesProtocol.tile);
    maplibregl.addProtocol("cog", MaplibreCOGProtocol.cogProtocol);

    // ========================================================================
    // JULY 15 COG
    // ========================================================================
    const rainfallCogUrl =
      "https://cfhydromet.com/basemaps/rainfall/texas/daily/2026/07/07/stage4_daily.tif";

    // ========================================================================
    // PIECEWISE-CONTINUOUS RAINFALL STYLE
    //
    // Continuous shading inside each family; hard hue jumps at family breaks.
    // ========================================================================
    const rainSegments = [
		{ min:0.001, max:0.25,  start:"#d7dee9", end:"#173f9d", width:1.55 },
		{ min:0.25,  max:1.50,  start:"#39ef63", end:"#006719", width:2.10 },
		{ min:1.50,  max:3.00,  start:"#fff23b", end:"#ff8b00", width:1.55 },
		{ min:3.00,  max:5.00,  start:"#ff5738", end:"#c90e18", width:1.30 },

			// 5–8": light purple -> dark purple
		{ min:5.00,  max:8.00,  start:"#c68cff", end:"#64208f", width:1.25 },

			// 8–12": hot pink -> deep magenta
		{ min:8.00,  max:12.00, start:"#ff5cc8", end:"#b0006f", width:1.10 }
	];

			// 12"+ extreme
	const extremeColor = "#5a003f";

    function hexToRgb(hex) {
      const clean = hex.replace("#", "");
      return [
        parseInt(clean.substring(0,2),16),
        parseInt(clean.substring(2,4),16),
        parseInt(clean.substring(4,6),16)
      ];
    }

    function clamp01(x) { return Math.max(0, Math.min(1, x)); }
    function lerp(a,b,t) { return a + (b-a)*t; }

    function interpolateRgb(c0,c1,t) {
      return [
        Math.round(lerp(c0[0],c1[0],t)),
        Math.round(lerp(c0[1],c1[1],t)),
        Math.round(lerp(c0[2],c1[2],t))
      ];
    }

    rainSegments.forEach(segment => {
      segment.rgb0 = hexToRgb(segment.start);
      segment.rgb1 = hexToRgb(segment.end);
    });

    const extremeRgb = hexToRgb(extremeColor);

    // ========================================================================
    // COG PIXEL COLOR FUNCTION
    // ========================================================================
    MaplibreCOGProtocol.setColorFunction(
      rainfallCogUrl,
      (pixel, color, metadata) => {
        const rawValue = pixel[0];

        if (rawValue === metadata.noData || !Number.isFinite(rawValue)) {
          color.set([0,0,0,0]);
          return;
        }

        const scale = Number.isFinite(metadata.scale) ? metadata.scale : 1;
        const offset = Number.isFinite(metadata.offset) ? metadata.offset : 0;
        const rainMm = rawValue * scale + offset;
        const rainIn = rainMm / 25.4;

        if (!Number.isFinite(rainIn) || rainIn < 0.001) {
          color.set([0,0,0,0]);
          return;
        }

        for (let i=0; i<rainSegments.length; i++) {
          const segment = rainSegments[i];

          if (rainIn >= segment.min && rainIn < segment.max) {
            const t = clamp01(
              (rainIn - segment.min) / (segment.max - segment.min)
            );

            const rgb = interpolateRgb(segment.rgb0, segment.rgb1, t);

            // Make trace/light rain intentionally less visually dominant.
            let alpha = 255;
            if (rainIn < 0.25) {
              const traceT = clamp01((rainIn - 0.001) / (0.25 - 0.001));
              alpha = Math.round(lerp(115,255,traceT));
            }

            color.set([rgb[0], rgb[1], rgb[2], alpha]);
            return;
          }
        }

        if (rainIn >= 12.0) {
          color.set([extremeRgb[0], extremeRgb[1], extremeRgb[2], 255]);
          return;
        }

        color.set([0,0,0,0]);
      }
    );

    // ========================================================================
    // HORIZONTAL LEGEND
    // ========================================================================
    const legendBar = document.getElementById("legend-bar");
    const legendLabels = document.getElementById("legend-labels");

    const totalLegendWeight = rainSegments.reduce(
      (sum, segment) => sum + segment.width,
      0
    );

    rainSegments.forEach(segment => {
      const div = document.createElement("div");
      div.className = "legend-segment";
      div.style.flex = `${segment.width} 1 0`;
      div.style.background = `linear-gradient(to right, ${segment.start}, ${segment.end})`;
      legendBar.appendChild(div);
    });

    const extremeWeight = 0.55;
    const extremeDiv = document.createElement("div");
    extremeDiv.className = "legend-segment";
    extremeDiv.style.flex = `${extremeWeight} 1 0`;
    extremeDiv.style.background = extremeColor;
    legendBar.appendChild(extremeDiv);

    const legendStops = [
      { value:"0",    weight:0 },
      { value:"0.25", weight:rainSegments[0].width },
      { value:"1.5",  weight:rainSegments[0].width + rainSegments[1].width },
      { value:"3",    weight:rainSegments[0].width + rainSegments[1].width + rainSegments[2].width },
      { value:"5",    weight:rainSegments[0].width + rainSegments[1].width + rainSegments[2].width + rainSegments[3].width },
      { value:"8",    weight:rainSegments[0].width + rainSegments[1].width + rainSegments[2].width + rainSegments[3].width + rainSegments[4].width },
      { value:"12+",  weight:totalLegendWeight + extremeWeight }
    ];

    const totalWeight = totalLegendWeight + extremeWeight;

    legendStops.forEach((stop,index) => {
      const label = document.createElement("span");
      label.className = "legend-label";
      if (index === 0) label.classList.add("first");
      if (index === legendStops.length - 1) label.classList.add("last");
      label.textContent = stop.value;
      label.style.left = `${100 * stop.weight / totalWeight}%`;
      legendLabels.appendChild(label);
    });

    // ========================================================================
    // MAP
    // ========================================================================
    const map = new maplibregl.Map({
      container:"map",
      style:"https://cfhydromet.com/styles/cfhydromet_basemap_light.json",
	  //style:"./cfhydromet_basemap_light.json",
      center:[-99.43335,30.115],
      zoom:6.7
    });

    function resizeMap() {
      window.setTimeout(() => {
        map.resize();
      }, 100);
    }

    window.addEventListener("resize", resizeMap);
    window.addEventListener("orientationchange", resizeMap);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeMap);
    }

    map.addControl(new maplibregl.NavigationControl(), "top-right");
    map.addControl(new maplibregl.ScaleControl({ maxWidth:120, unit:"imperial" }), "bottom-left");

    map.on("load", () => {
      map.addSource("texas-rainfall", {
        type:"raster",
        url:`cog://${rainfallCogUrl}`,
        tileSize:256
      });

      const firstSymbolLayer = map.getStyle().layers.find(layer => layer.type === "symbol");
      const beforeLayerId = firstSymbolLayer ? firstSymbolLayer.id : undefined;

      map.addLayer(
        {
          id:"texas-rainfall",
          type:"raster",
          source:"texas-rainfall",
          paint:{
            "raster-opacity":0.78,
            "raster-resampling":"linear",
            "raster-fade-duration":0
          }
        },
        beforeLayerId
      );

      map.addSource("bundy", {
        type:"geojson",
        data:"https://cfhydromet.com/config/web_map/bundy_outline.geojson"
      });

      map.addLayer({
        id:"bundy-fill",
        type:"fill",
        source:"bundy",
        paint:{ "fill-color":"#e69f00", "fill-opacity":0.18 }
      });

      map.addLayer({
        id:"bundy-outline",
        type:"line",
        source:"bundy",
        paint:{ "line-color":"#b36b00", "line-width":3 }
      });

      map.addSource("turtle-farm", {
        type:"geojson",
        data:"https://cfhydromet.com/config/web_map/turtle_farm_outline.geojson"
      });

      map.addLayer({
        id:"turtle-farm-fill",
        type:"fill",
        source:"turtle-farm",
        paint:{ "fill-color":"#2a9d8f", "fill-opacity":0.18 }
      });

      map.addLayer({
        id:"turtle-farm-outline",
        type:"line",
        source:"turtle-farm",
        paint:{ "line-color":"#1f6f66", "line-width":3 }
      });

      console.log("July 15 rainfall COG + piecewise-continuous legend + Labatt overlays added.");
    });

    map.on("error", e => console.error("MapLibre error:", e.error || e));
  </script>
</body>
</html>
